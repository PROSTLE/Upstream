<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f6f3" />
    <meta name="color-scheme" content="light" />
    <script>
      // Light unless someone chose otherwise, set before first paint so the page never flashes the wrong colours. See web/src/theme.ts.
      (function () {
        var t = null;
        try { t = localStorage.getItem("upstream.theme"); } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t === "dark" ? "dark" : "light");
      })();
    </script>
    <meta name="description" content="Upstream pays the open-source maintainers your AI coding agent actually relied on, through PayPal." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <title>Upstream</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
